name: Acceptance CI

# Local reusable workflow. plone/meta's frontend-acceptance workflow still
# installs Cypress, and neither Volto core nor plone/meta supports Playwright
# yet, so this repository runs its own.

on:
  workflow_call:
    inputs:
      node-version:
        type: string
        required: true

jobs:
  acceptance:
    name: "Acceptance tests (Playwright)"
    runs-on: ubuntu-latest

    steps:
      - name: Main checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup uv
        uses: plone/meta/.github/actions/setup_uv@2.x

      - name: Setup codebase
        uses: plone/meta/.github/actions/setup_frontend@2.x
        with:
          node-version: ${{ inputs.node-version }}
          working-directory: frontend

      - name: Install the Playwright browser
        run: make -C frontend install-acceptance

      - name: Build the acceptance images
        run: make acceptance-images-build

      - name: Run the acceptance tests
        run: make ci-acceptance-test

      - name: Upload the Playwright report and traces
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-acceptance-report
          path: |
            frontend/playwright-report
            frontend/acceptance/results
